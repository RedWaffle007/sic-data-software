services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sicdata
      POSTGRES_PASSWORD: sicdata
      POSTGRES_DB: sicdata
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicdata -d sicdata"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/SicData.Api
    ports:
      - "5100:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=db;Port=5432;Database=sicdata;Username=sicdata;Password=sicdata"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
